<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f3f6f8; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#d5dde3; --marine:#0b5c7a; --marine-ink:#ffffff; --signal:#e0a100;
    --done:#1f8a5b; --err:#b3261e; --tint:#e6eff4;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0f171d; --card:#16212a; --ink:#e7edf1; --muted:#93a3af;
      --line:#2a3944; --marine:#5bb6d6; --marine-ink:#06222d; --signal:#f2b92e;
      --done:#4cc38a; --err:#ff8a80; --tint:#1b2a34;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:16px; line-height:1.55; }
  main { max-width:760px; margin:0 auto; padding:72px 20px 96px; }

  .brand { font-weight:600; color:var(--marine); letter-spacing:.01em; margin-bottom:28px; }
  h1 { font-family:var(--serif); font-weight:600; font-size:clamp(3rem, 10vw, 5.2rem);
       line-height:1.02; letter-spacing:-.025em; margin:0 0 14px; }
  .lede { color:var(--muted); font-size:1.08rem; max-width:54ch; margin:0 0 32px; }

  form { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px;
         box-shadow:0 1px 2px rgba(20,32,43,.05), 0 14px 28px -16px rgba(20,32,43,.22);
         display:flex; gap:8px; align-items:flex-end; transition:border-color .15s, box-shadow .15s; }
  form:focus-within { border-color:var(--marine); box-shadow:0 0 0 3px color-mix(in srgb, var(--marine) 22%, transparent); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:inherit;
             font:inherit; font-family:var(--serif); font-size:1.2rem; line-height:1.4;
             padding:12px 14px; min-height:52px; max-height:160px; }
  textarea::placeholder { color:var(--muted); }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; }
  #go { background:var(--marine); color:var(--marine-ink); font-weight:600; padding:14px 26px; border-radius:12px; }
  #go:hover:not(:disabled) { filter:brightness(1.08); }
  #go:disabled { opacity:.55; cursor:progress; }
  button:focus-visible { outline:3px solid var(--signal); outline-offset:2px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:16px 2px 0; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--muted);
          padding:7px 14px; border-radius:999px; font-size:.9rem; background:var(--card); }
  .chip:hover { border-color:var(--marine); color:var(--marine); }

  /* pipeline tracker */
  #tracker { display:none; margin:40px 0 0; }
  #tracker.on { display:block; }
  ol.steps { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:0; }
  .step { position:relative; padding-top:34px; padding-right:12px; }
  .step::before { content:""; position:absolute; top:11px; left:24px; right:0; height:2px; background:var(--line); }
  .step:last-child::before { display:none; }
  .step.done::before { background:var(--done); }
  .dot { position:absolute; top:0; left:0; width:24px; height:24px; border-radius:50%;
         border:2px solid var(--line); background:var(--paper); display:grid; place-items:center;
         font-size:.8rem; font-weight:600; color:var(--muted); }
  .step.active .dot { border-color:var(--signal); color:var(--signal); animation:pulse 1.4s ease-in-out infinite; }
  .step.done .dot { background:var(--done); border-color:var(--done); color:#fff; }
  .step b { display:block; font-weight:600; }
  .step span { display:block; color:var(--muted); font-size:.88rem; }
  .step.pending b { color:var(--muted); }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--signal) 28%, transparent); } }
  #meta { margin-top:16px; font-size:.88rem; color:var(--muted); }
  #meta a { color:var(--marine); }
  #error { display:none; margin-top:24px; padding:14px 16px; border-radius:10px;
           border:1px solid var(--err); color:var(--err); background:color-mix(in srgb, var(--err) 8%, transparent); }
  #error.on { display:block; }

  /* report */
  #sheet { display:none; margin-top:40px; background:var(--card); border:1px solid var(--line);
           border-radius:14px; }
  #sheet.on { display:block; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px;
         padding:12px 16px; border-bottom:1px solid var(--line); color:var(--muted); font-size:.9rem; }
  .bar .acts { display:flex; gap:8px; }
  .bar button { background:var(--tint); color:var(--ink); padding:7px 14px; font-size:.88rem; }
  .bar button:hover { background:color-mix(in srgb, var(--marine) 18%, var(--tint)); }
  #report { padding:28px clamp(18px, 5vw, 44px) 40px; font-family:var(--serif); font-size:1.14rem;
            line-height:1.7; overflow-wrap:anywhere; }
  #report h1, #report h2, #report h3 { font-family:var(--serif); line-height:1.2; margin:1.6em 0 .5em; font-weight:600; }
  #report h1 { font-size:1.9rem; margin-top:0; }
  #report h2 { font-size:1.45rem; }
  #report h3 { font-size:1.2rem; }
  #report p, #report li { max-width:68ch; }
  #report a { color:var(--marine); }
  #report blockquote { margin:1.2em 0; padding:2px 0 2px 18px; border-left:3px solid var(--marine); color:var(--muted); }
  #report code { font-size:.9em; background:var(--tint); padding:1px 6px; border-radius:5px; }
  #report pre, #report table { display:block; overflow-x:auto; }
  #report pre { background:var(--tint); padding:14px; border-radius:10px; }
  #report table { border-collapse:collapse; font-family:var(--sans); font-size:.95rem; }
  #report th, #report td { border:1px solid var(--line); padding:8px 12px; text-align:left; }

  /* citations */
  a.cite { font-family:var(--sans); font-size:.72em; vertical-align:super; line-height:0; text-decoration:none;
           color:var(--marine); font-weight:600; padding:0 1px; border-radius:3px; }
  a.cite:hover, a.cite:focus-visible { background:var(--tint); outline:none; }
  #tip { position:fixed; z-index:50; display:none; width:min(340px, calc(100vw - 24px)); background:var(--card);
         color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
         box-shadow:0 8px 28px rgba(0,0,0,.22); font-family:var(--sans); font-size:.88rem; line-height:1.45; }
  #tip .k { color:var(--muted); font-size:.8rem; margin-bottom:4px; }
  #tip .t { display:block; font-weight:600; color:var(--marine); margin-bottom:4px; text-decoration:none; }
  #tip .t:hover { text-decoration:underline; }
  #tip .m { color:var(--muted); margin-bottom:6px; }
  #tip .s { border-left:3px solid var(--line); padding-left:10px; color:var(--ink); }
  #refs { padding:4px clamp(18px, 5vw, 44px) 36px; border-top:1px solid var(--line); }
  #refs h2 { font-family:var(--serif); font-size:1.3rem; margin:26px 0 8px; }
  #refs ol { margin:0; padding:0; list-style:none; }
  #refs li { display:grid; grid-template-columns:2.4em 1fr; gap:4px; padding:7px 8px; margin:0 -8px;
             border-radius:8px; font-size:.95rem; scroll-margin-top:20px; }
  #refs li:target { background:var(--tint); }
  #refs .n { color:var(--muted); font-weight:600; }
  #refs a { color:var(--marine); font-weight:500; overflow-wrap:anywhere; }
  #refs .m { display:block; color:var(--muted); font-size:.86rem; }
  @media (max-width:560px) {
    main { padding-top:32px; }
    form { flex-direction:column; align-items:stretch; }
    #go { width:100%; }
    .step span { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { .step.active .dot { animation:none; } html { scroll-behavior:auto; } }
</style>
</head>
<body>
<main>
  <h1>Deep Research</h1>
  <p class="lede">Ask a question and get a written report built from web sources and academic papers, with citations you can hover over.</p>

  <form id="f">
    <textarea id="q" rows="1" autocomplete="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-lpignore="true" data-1p-ignore placeholder="e.g. How are heat pumps changing home heating in cold climates?" required minlength="3" maxlength="500" aria-label="Research topic"></textarea>
    <button id="go" type="submit">Research</button>
  </form>
  <div class="chips" id="chips">
    <button type="button" class="chip">Solid-state batteries today</button>
    <button type="button" class="chip">Four-day work week</button>
    <button type="button" class="chip">How CRISPR works</button>
  </div>

  <section id="tracker" aria-live="polite">
    <ol class="steps">
      <li class="step pending" id="s1"><i class="dot">1</i><b>Plan</b><span>Choosing what to search</span></li>
      <li class="step pending" id="s2"><i class="dot">2</i><b>Search</b><span id="s2d">Web and academic papers</span></li>
      <li class="step pending" id="s3"><i class="dot">3</i><b>Write</b><span>Drafting the report</span></li>
    </ol>
    <div id="meta"></div>
  </section>
  <div id="error" role="alert"></div>

  <article id="sheet">
    <div class="bar"><span id="wc"></span>
      <div class="acts"><button id="copy" type="button">Copy markdown</button><button id="dl" type="button">Download .md</button></div>
    </div>
    <div id="report"></div>
    <div id="refs"></div>
  </article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const f=$("f"), q=$("q"), go=$("go"), tracker=$("tracker"), meta=$("meta"),
        err=$("error"), sheet=$("sheet"), rep=$("report");
  let rawReport = "";

  const setStep = n => [1,2,3].forEach(i => {
    $("s"+i).className = "step " + (i < n ? "done" : i === n ? "active" : "pending");
    $("s"+i).querySelector(".dot").textContent = i < n ? "\u2713" : i;
  });
  const finishAll = () => { [1,2,3].forEach(i => { $("s"+i).className="step done"; $("s"+i).querySelector(".dot").textContent="\u2713"; }); };

  const grow = () => { q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,160)+"px"; };
  q.addEventListener("input", grow);
  q.addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { q.value=c.textContent; grow(); q.focus(); }));

  function showTrace(url) {
    meta.textContent = "";
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "View run trace on OpenAI";
    meta.append(a);
  }
  function onStatus(t) {
    if (t.startsWith("Trace: ")) { showTrace(t.slice(7)); return; }
    if (t.startsWith("Planning")) setStep(1);
    else if (t.startsWith("Planned")) { setStep(2); const m=t.match(/\((\d+) web, (\d+) academic\)/); if (m) $("s2d").textContent = m[1] + " web and " + m[2] + " academic searches in parallel"; }
    else if (t.startsWith("Searches complete")) setStep(3);
  }
  function fail(msg) { err.textContent = msg; err.classList.add("on"); tracker.classList.remove("on"); }

  f.addEventListener("submit", async e => {
    e.preventDefault();
    go.disabled = true; go.textContent = "Researching\u2026";
    err.classList.remove("on"); sheet.classList.remove("on"); rep.innerHTML = "";
    tracker.classList.add("on"); meta.textContent = ""; setStep(1);
    try {
      const res = await fetch("/api/research", { method:"POST",
        headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ query:q.value.trim() }) });
      if (!res.ok) throw new Error(res.status === 422 ? "Please enter a topic of 3 to 500 characters." : "Request failed (" + res.status + ").");
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const m = JSON.parse(line);
          if (m.type === "status") onStatus(m.text);
          else if (m.type === "error") fail(m.text);
          else if (m.type === "report") {
            rawReport = m.text.markdown; finishAll();
            renderReport(m.text.markdown, m.text.sources);
            $("wc").textContent = rawReport.split(/\s+/).filter(Boolean).length.toLocaleString() + " words, " + m.text.sources.length + " sources";
            sheet.classList.add("on");
            sheet.scrollIntoView({ behavior:"smooth", block:"start" });
          }
        }
      }
    } catch (ex) { fail(ex.message); }
    finally { go.disabled = false; go.textContent = "Research"; }
  });

  /* ---- citations: render, tooltip, reference list ---- */
  const tip = document.createElement("div"); tip.id = "tip"; tip.setAttribute("role","tooltip"); document.body.append(tip);
  let srcMap = {}, hideT;
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch { return "#"; } };
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const metaLine = s => s.kind === "paper"
    ? [s.authors, s.year, s.venue].filter(Boolean).join(", ") + (s.cited_by != null ? " (cited by " + s.cited_by + ")" : "")
    : host(s.url);

  function renderReport(markdown, sources) {
    srcMap = {}; sources.forEach(s => srcMap[s.n] = s);
    const md = markdown.replace(/\[(\d+)\](?!\()/g, (m, n) =>
      srcMap[n] ? '<a class="cite" data-n="' + n + '" href="#ref-' + n + '">[' + n + ']</a>' : m);
    rep.innerHTML = DOMPurify.sanitize(marked.parse(md));
    const refs = $("refs"); refs.textContent = "";
    [["web", "Web sources"], ["paper", "Academic papers"]].forEach(([kind, label]) => {
      const list = sources.filter(s => s.kind === kind);
      if (!list.length) return;
      refs.append(el("h2", "", label));
      const ol = el("ol");
      list.forEach(s => {
        const li = el("li"); li.id = "ref-" + s.n;
        li.append(el("span", "n", "[" + s.n + "]"));
        const body = el("div"), a = el("a", "", s.title);
        a.href = safeUrl(s.url); a.target = "_blank"; a.rel = "noopener";
        body.append(a, el("span", "m", metaLine(s)));
        li.append(body); ol.append(li);
      });
      refs.append(ol);
    });
  }

  function showTip(c) {
    const s = srcMap[c.dataset.n]; if (!s) return;
    tip.textContent = "";
    tip.append(el("div", "k", s.kind === "paper" ? "Academic paper" : "Web source"));
    const t = el("a", "t", s.title); t.href = safeUrl(s.url); t.target = "_blank"; t.rel = "noopener";
    tip.append(t, el("div", "m", metaLine(s)));
    if (s.snippet) tip.append(el("div", "s", s.kind === "paper" ? "Abstract: " + s.snippet + "\u2026" : "Cited for: " + s.snippet));
    tip.style.display = "block";
    const r = c.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let left = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 12));
    let top = r.bottom + 8; if (top + h > innerHeight - 8 && r.top - h - 8 > 8) top = r.top - h - 8;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  const hideTip = () => { hideT = setTimeout(() => tip.style.display = "none", 180); };
  const keepTip = () => clearTimeout(hideT);
  rep.addEventListener("mouseover", e => { const c = e.target.closest("a.cite"); if (c) { keepTip(); showTip(c); } });
  rep.addEventListener("mouseout", e => { if (e.target.closest("a.cite")) hideTip(); });
  rep.addEventListener("focusin", e => { const c = e.target.closest("a.cite"); if (c) { keepTip(); showTip(c); } });
  rep.addEventListener("focusout", e => { if (e.target.closest("a.cite")) hideTip(); });
  rep.addEventListener("click", e => {   /* touch screens have no hover: tap shows the card */
    const c = e.target.closest("a.cite");
    if (c && matchMedia("(hover: none)").matches) { e.preventDefault(); keepTip(); showTip(c); }
  });
  tip.addEventListener("mouseenter", keepTip); tip.addEventListener("mouseleave", hideTip);
  document.addEventListener("click", e => { if (!e.target.closest("a.cite") && !e.target.closest("#tip")) tip.style.display = "none"; });
  addEventListener("scroll", () => tip.style.display = "none", { passive: true });

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(rawReport); $("copy").textContent = "Copied"; }
    catch { $("copy").textContent = "Copy failed"; }
    setTimeout(() => $("copy").textContent = "Copy markdown", 1600);
  });
  $("dl").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rawReport], { type:"text/markdown" }));
    a.download = "research-report.md"; a.click(); URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
