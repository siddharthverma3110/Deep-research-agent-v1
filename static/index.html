<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --border:#d8d8d8; --accent:#0284c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e8e8e8; --muted:#9aa0a6; --border:#333; --accent:#38bdf8; }
  }
  body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg);
         max-width:820px; margin:0 auto; padding:24px 16px; line-height:1.6; }
  h1 { margin-top:0; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:10px; font-size:1rem; border:1px solid var(--border);
          border-radius:6px; background:transparent; color:inherit; }
  button { padding:10px 18px; font-size:1rem; border:0; border-radius:6px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { color:var(--muted); font-size:.9rem; margin:12px 0; white-space:pre-wrap; }
  #report { margin-top:16px; overflow-wrap:anywhere; }
  #report pre, #report table { overflow-x:auto; display:block; }
</style>
</head>
<body>
  <h1>Deep Research</h1>
  <form id="f" class="row">
    <input id="q" placeholder="What topic would you like to research?" required minlength="3" maxlength="500">
    <button id="go">Run</button>
  </form>
  <div id="status"></div>
  <div id="report"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script>
    const f = document.getElementById("f"), q = document.getElementById("q"),
          go = document.getElementById("go"), st = document.getElementById("status"),
          rep = document.getElementById("report");

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      go.disabled = true; st.textContent = "Starting..."; rep.innerHTML = "";
      try {
        const res = await fetch("/api/research", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q.value }),
        });
        if (!res.ok) throw new Error("Request failed (" + res.status + ")");
        const reader = res.body.getReader(), dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n"); buf = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const m = JSON.parse(line);
            if (m.type === "status") st.textContent = m.text;
            else if (m.type === "error") st.textContent = m.text;
            else if (m.type === "report") {
              st.textContent = "Done.";
              rep.innerHTML = DOMPurify.sanitize(marked.parse(m.text));
            }
          }
        }
      } catch (err) {
        st.textContent = "Error: " + err.message;
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
